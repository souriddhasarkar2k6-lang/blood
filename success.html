<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Redirecting - BloodCloud</title>
    <link rel="stylesheet" href="style.css" />
    <style>
      .loader {
        border: 4px solid #f3f3f3;
        border-top: 4px solid var(--primary-color, #d9534f); 
        border-radius: 50%;
        width: 40px;
        height: 40px;
        animation: spin 1s linear infinite;
        margin: 20px auto;
      }

      @keyframes spin {
        0% {
          transform: rotate(0deg);
        }
        100% {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="form-container" style="text-align: center">
        <h1>Welcome!</h1>
        <div class="form-header">
          <p>You have successfully logged in.</p>
        </div>

        <div class="loader"></div>

        <p>
          Please wait while we redirect you...
        </p>
        <p style="font-size: 0.8rem; color: #666">
          Redirecting in <span id="countdown">5</span>s
        </p>
        <p id="error-message" style="color: red; display: none;"></p>
      </div>
    </div>

    <script type="module">
      import { initializeApp } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js";
      import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-auth.js";
      import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-firestore.js";

      const firebaseConfig = {
        apiKey: "AIzaSyAAcC0hcVgY3RpMm6dPW6XiJbES3c4R7N0",
        authDomain: "loginsite-67.firebaseapp.com",
        projectId: "loginsite-67",
        storageBucket: "loginsite-67.firebasestorage.app",
        messagingSenderId: "312888450087",
        appId: "1:312888450087:web:ffe6fcd7b177f0911a0202",
        measurementId: "G-RZZ0FK89DK"
      };

      const app = initializeApp(firebaseConfig);
      const auth = getAuth(app);
      const db = getFirestore(app);

      onAuthStateChanged(auth, async (user) => {
        if (user) {
          // User is logged in, start countdown to redirect to the main homepage.
          let seconds = 5;
          const countdownElement = document.getElementById("countdown");

          const interval = setInterval(() => {
            seconds--;
            countdownElement.textContent = seconds;
            if (seconds <= 0) {
              clearInterval(interval);
              window.location.href = "home.html";
            }
          }, 1000);
        } else {
          // No user is signed in. This shouldn't happen on the success page.
          document.getElementById("error-message").textContent = "No user is signed in. Redirecting to login...";
          document.getElementById("error-message").style.display = "block";
          setTimeout(() => { window.location.href = "verify.html"; }, 3000);
        }
      });
    </script>
  </body>
</html>

<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login Form</title>
    <link rel="stylesheet" href="style.css" />
    <script type="module" src="firebaseauth.js"></script>
  </head>
  <body>
    <div class="container">
      <div class="form-container">
        <h1>Sign In</h1>
        <div class="form-blob">
          <img
            src="assets/images/blob.svg"
            alt="blob"
            class="blob-image blob-image--1"
          />
          <img
            src="assets/images/blob.svg"
            alt="blob"
            class="blob-image blob-image--2"
          />
          <img
            src="assets/images/blob.svg"
            alt="blob"
            class="blob-image blob-image--3"
          /> 
        </div>

        <div class="form-header">
          <p>Welcome back! Access your account below.</p>
        </div>
        <form class="form-box">
          <div class="input-group">
            <input
              type="email"
              id="email"
              class="input-field"
              placeholder=""
            />
            <label for="email" class="floating-label">Email address</label>
          </div>
          <button
            type="submit"
            id="submit"
            class="form-btn form-btn--submit"
          >
            Send Sign-In Link
          </button>
        </form>
        <div class="form-divider">
          <p>Or</p>
        </div>
        <div class="form-bottom">
          <div class="form-socials">
            <button id="google-login-btn" class="form-btn form-btn--social">
              <span>Continue with</span>
              <img
                src="images/google.png"
                class="btn-icon"
                alt="social icon"
              />
            </button>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
